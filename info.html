
<!DOCTYPE html>
<!--
Tells the browser that this document uses HTML5.
It helps the browser understand how to read the HTML code.
-->

<html lang="en">
<!--
<html> is the main container of the whole HTML document.

lang="en" tells the browser that the main language
of the webpage is English.
-->

<head>
<!--
<head> contains information and settings about the webpage.
This information is usually not directly visible on the page.
-->

    <meta charset="UTF-8">
    <!--
    charset means Character Set.

    UTF-8 allows the webpage to correctly display
    letters, numbers, symbols, and many different languages.
    -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
    This makes the webpage responsive on different screen sizes.

    width=device-width
    means the webpage should use the device's screen width.

    initial-scale=1.0
    means the webpage starts at normal 100% zoom.

    This is important for mobile phones, tablets, and computers.
    -->

    <title>Document</title>
    <!--
    <title> sets the name shown on the browser tab.

    For example:
    <title>My Website</title>

    The browser tab will show "My Website".
    -->

</head>
<!--
</head> marks the end of the head section.
-->

<body>
<!--
<body> contains the visible content of the webpage.

    Text, images, buttons, links, forms, etc.
    are normally placed inside the body.
-->

</body>
<!--
</body> marks the end of the visible webpage content.
-->

</html>
<!--
</html> marks the end of the entire HTML document.
-->
